name: ATS Sandbox Nightly (Greenhouse)

# Phase 0 T15 Step 8: connect → import → push → report → webhook against the
# Greenhouse sandbox, nightly (not per PR). The job is a no-op until the
# sandbox credentials exist as repository secrets:
#   GREENHOUSE_SANDBOX_API_KEY, GREENHOUSE_SANDBOX_ON_BEHALF_OF,
#   GREENHOUSE_SANDBOX_WEBHOOK_SECRET (optional)
# Acceptance for the T14 exit gate: five consecutive green nightly runs.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GREENHOUSE_SANDBOX_API_KEY: ${{ secrets.GREENHOUSE_SANDBOX_API_KEY }}
      GREENHOUSE_SANDBOX_ON_BEHALF_OF: ${{ secrets.GREENHOUSE_SANDBOX_ON_BEHALF_OF }}
      GREENHOUSE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.GREENHOUSE_SANDBOX_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$GREENHOUSE_SANDBOX_API_KEY" ] || [ -z "$GREENHOUSE_SANDBOX_ON_BEHALF_OF" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Greenhouse sandbox credentials are not configured; skipping (external gate, see docs/ops/ats-greenhouse.md)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.present == 'true'
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Sandbox loop
        if: steps.creds.outputs.present == 'true'
        run: npx vitest run __tests__/ats/greenhouse.sandbox.test.ts --reporter=verbose
