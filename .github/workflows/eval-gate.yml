name: Eval Gate

on:
  pull_request:
    branches: [main, "release/*"]
  push:
    branches: [main, "release/*"]

# Required status checks — configure in GitHub repo settings:
#   Settings → Branches → Branch protection rules → main
#   Require: "TypeScript Type Check", "Preservation Gates", "Eval Harness (Mock Mode)"

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  preservation:
    name: Preservation Gates
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      EVAL_MOCK_MODE: "true"
      PLAYWRIGHT_START_SERVER: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      # Server-rendered dates in authenticated baselines must not depend on runner TZ.
      TZ: "UTC"
      # Password for the throwaway accounts inside the local Supabase stack
      # booted below. It is not a secret: the stack lives and dies with the job.
      E2E_SEED_PASSWORD: "think5-e2e-local-only-Pa55"
      # Signs the email-gated shared-report cookie (lib/report-share-cookie);
      # local-only value for the golden share-link spec.
      NEXTAUTH_SECRET: "think5-e2e-local-only-nextauth-secret-0123456789"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate preservation manifest
        run: npm run manifest
      - name: Upload generated manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preservation-manifest
          path: docs/preservation/manifest.json
          retention-days: 7
      - name: Lint
        run: npm run lint
      - name: Unit tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key"
        run: npx vitest run

      # ── Real auth for authenticated golden baselines ───────────────────
      # A local Supabase stack (GoTrue + PostgREST + Postgres) applies
      # supabase/migrations (profiles, triggers, RLS). Prisma tables are
      # pushed on top, deterministic identities are seeded through the Auth
      # admin API, and Playwright signs in through /auth/signin. No auth
      # bypass exists anywhere in this pipeline.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase stack (auth, rest, db)
        run: npm run e2e:stack
      - name: Export local Supabase credentials
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "DATABASE_URL=${DB_URL}"
            echo "DIRECT_URL=${DB_URL}"
          } >> "$GITHUB_ENV"
      - name: Build ephemeral schema (prisma db push, then supabase migrations)
        run: npm run e2e:db
      - name: Seed deterministic E2E identities and data
        run: npm run e2e:seed

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Inngest dev server (durable report pipeline for the golden path)
        run: |
          nohup npx --yes inngest-cli@latest dev -u http://localhost:3000/api/inngest --no-discovery --no-poll > inngest-dev.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8288/ > /dev/null; then echo "inngest dev up"; break; fi
            sleep 1
          done
      - name: Golden E2E (public + authenticated)
        env:
          # T14 golden path: deterministic interviewer + scorer, real Inngest pipeline.
          AI_PROVIDER: "mock"
          INNGEST_DEV: "1"
          INNGEST_BASE_URL: "http://127.0.0.1:8288"
          # lib/email/resend.ts constructs the SDK at import time and the
          # recruiter onboarding API (called by DashboardLayout, fail-closed)
          # imports it. No email is sent during the golden run; the value only
          # has to be non-empty.
          RESEND_API_KEY: "re_ci_placeholder_never_sends"
          RESEND_FROM_EMAIL: "ci@think5.test"
          E2E_AUTH_FIXTURES: "true"
          E2E_RECRUITER_STORAGE_STATE: e2e/.auth/recruiter.json
          E2E_CANDIDATE_STORAGE_STATE: e2e/.auth/candidate.json
          ROUTE_MATRIX_FIXTURES: '{"/jobs/[id]":"/jobs/e2e-job-backend","/candidates/[id]":"/candidates/e2e-candidate-jordan","/interview/[id]":"/interview/e2e-interview-welcome"}'
        run: npm run test:e2e:golden
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-e2e-artifacts
          path: |
            playwright-report
            test-results
            e2e/golden/**/*-snapshots
            inngest-dev.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify committed manifest baseline
        if: always()
        run: git diff --exit-code -- docs/preservation/manifest.json

  hydration:
    name: Hard Navigation Hydration
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      EVAL_MOCK_MODE: "true"
      PLAYWRIGHT_START_SERVER: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Hard-navigation hydration regression (CSP)
        run: npx playwright test e2e/hard-navigation.spec.ts --project=chromium
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hydration-regression-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  eval-harness:
    name: Eval Harness (Mock Mode)
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      EVAL_MOCK_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx eval/interview-harness.ts --all

      - name: Verify eval passed
        run: |
          if [ -f eval/eval-results.json ]; then
            PASSED=$(node -e "const r=JSON.parse(require('fs').readFileSync('eval/eval-results.json','utf8')); console.log(r[r.length-1]?.overallPassed ?? false)")
            if [ "$PASSED" != "true" ]; then
              echo "::error::Eval harness did not pass — merge blocked"
              exit 1
            fi
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/eval-results.json
          retention-days: 30
